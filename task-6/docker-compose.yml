# Task 6 explicitly reuses "the same self-hosted Langfuse" as Task 5 (see
# root README's tech stack section), so this is an identical copy of
# task-5/docker-compose.yml, kept here too so this PR is reviewable
# standalone without task-5 checked out. The live run captured in this
# task's README actually reused task-5's already-running instance rather
# than standing up a second one side by side.
#
# Self-hosted Langfuse v3 OSS stack: postgres (metadata) + clickhouse
# (traces/observations, OLAP) + minio (S3-compatible blob store for
# events) + redis (queues) + langfuse-web + langfuse-worker.
#
# Two real infra hiccups along the way, both real network issues in this
# environment, not code bugs (see task-5/README.md "A real infra swap
# mid-task" for full details):
# 1. docker.io's blob CDN (production.cloudfront.docker.com) was hitting
#    repeated TLS handshake timeouts and truncated reads on the first
#    attempt to pull these images, worked around by pulling langfuse's own
#    two images from ghcr.io (a mirror) instead of docker.io directly.
# 2. Fell back to Langfuse's v2 (postgres-only) self-host line first to
#    minimize pull weight, but the current Langfuse Python SDK (v4, OTel-
#    native) sends traces via OTLP, a v3-server-only ingestion path, a v2
#    server 404s on it. Once the docker.io pulls turned out to actually
#    work fine on a later retry (clickhouse/minio/redis/langfuse-worker
#    all pulled cleanly), went back to the originally-planned v3 stack.
#
# No Langfuse Cloud/LangSmith credentials exist in this environment, same
# tradeoff FleetPulse documents for self-hosting Prometheus/Grafana
# instead of a paid cloud service.
#
# LANGFUSE_INIT_* env vars bootstrap a fixed org/project/user/API-keypair
# on first boot (Langfuse's own documented non-interactive setup path), so
# eval.py can authenticate with a fixed key pair from `.env` instead of
# requiring a manual UI signup step.
name: tutorloop-langfuse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9091:9091"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/langfuse || true &&
      exit 0
      "

  redis:
    image: redis:7-alpine
    command: --requirepass langfuse
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:3
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_CONNECTION_STRING: redis://:langfuse@redis:6379
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:3
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_CONNECTION_STRING: redis://:langfuse@redis:6379
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-minio-data:
