name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-task-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Task branches are based off main and never merged (hard PR-workflow
      # rule), so a later task's branch won't contain earlier unmerged
      # tasks' folders yet. Check for the folder and skip the remaining
      # steps cleanly instead of failing CI for a task this branch doesn't
      # touch (a job-level `if` can't do this: it evaluates before
      # actions/checkout runs, so the folder never exists yet at that point).
      - name: Check task-1 exists on this branch
        id: check
        run: echo "exists=$([ -d task-1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-1
        run: pip install -r ../requirements.txt
      - name: ReAct loop, tools, and error-recovery tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: Ollama calls are monkeypatched, no live model
        # server needed. Exercises the tool router, step-limit, and
        # tool-error recovery logic directly.
        working-directory: task-1
        run: python -m pytest tests -v

  test-task-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-2 exists on this branch
        id: check
        run: echo "exists=$([ -d task-2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-2
        run: pip install -r ../requirements.txt
      - name: LangGraph routing, checkpointer, and human-in-the-loop tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn is scripted, MemorySaver is used instead
        # of the SQLite checkpointer, no live Ollama server needed.
        working-directory: task-2
        run: python -m pytest tests -v

  test-task-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-3 exists on this branch
        id: check
        run: echo "exists=$([ -d task-3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-3
        run: pip install -r ../requirements.txt
      - name: Planner/content/quiz/coordinator multi-agent tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn is scripted per agent, no live Ollama
        # server needed.
        working-directory: task-3
        run: python -m pytest tests -v

  test-task-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-4 exists on this branch
        id: check
        run: echo "exists=$([ -d task-4 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-4
        # tutor.py imports ollama at module level (used only as the
        # default chat_fn, tests always inject their own), and rag.py also
        # imports ollama at module level for its embedding calls, but
        # chromadb is imported lazily inside rag.py's functions and no
        # test actually calls build_index()/retrieve() against a live
        # Ollama server, so nothing here needs a running Ollama or a
        # built Chroma index.
        run: pip install pytest ollama
      - name: Memory, RAG loading, and grounded+personalized tutor tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: SQLite memory uses a tmp_path fixture, RAG
        # loading tests only exercise load_sections() (no embedding
        # calls), tutor tests inject chat_fn/retrieve_fn. No live Ollama
        # server and no Chroma index needed in CI.
        working-directory: task-4
        run: python -m pytest tests -v

  test-task-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-5 exists on this branch
        id: check
        run: echo "exists=$([ -d task-5 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-5
        # agent.py imports ollama, tracing.py imports langfuse, both at
        # module level, but no test calls agent.run() against a live
        # Ollama server or tracing.traced_run() against a live Langfuse
        # server, so nothing here needs either running.
        run: pip install pytest ollama langfuse
      - name: Agent trajectory and trajectory/tool-call/task-success scoring tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn is scripted in test_agent.py, scoring.py
        # is pure functions over a scripted trajectory in test_scoring.py.
        # No live Ollama, no live Langfuse server, in CI.
        working-directory: task-5
        run: python -m pytest tests -v

  test-task-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-6 exists on this branch
        id: check
        run: echo "exists=$([ -d task-6 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-6
        # agent.py imports ollama, otel_tracing.py/feedback.py/dashboard.py
        # import opentelemetry/langfuse, all at module level, but no test
        # calls agent.run() against a live Ollama server or the OTel/
        # Langfuse-dependent modules against a live stack, so nothing here
        # needs either running.
        run: pip install pytest ollama langfuse opentelemetry-sdk opentelemetry-exporter-otlp
      - name: Agent usage/latency aggregation, cost model, and feedback-mapping tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn is scripted in test_agent.py (returns the
        # same dict shape Ollama's real usage figures do), cost.py is pure
        # functions, feedback.py's score-value mapping needs no network.
        # otel_tracing.py/dashboard.py are inherently networked and are
        # exercised live instead, see task-6/README.md's "Done when".
        working-directory: task-6
        run: python -m pytest tests -v

  test-task-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-7 exists on this branch
        id: check
        run: echo "exists=$([ -d task-7 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-7
        # agent.py and online_eval.py import ollama at module level, but
        # no test calls agent.run() or online_eval.judge_score() against
        # a live Ollama server, all scripted via chat_fn, so nothing here
        # needs it running.
        run: pip install pytest ollama
      - name: Online eval, feedback-to-dataset, and shadow-test decision tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn/judge chat_fn are both scripted, dataset
        # writes go through tmp_path. No live Ollama server in CI.
        working-directory: task-7
        run: python -m pytest tests -v

  test-task-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-8 exists on this branch
        id: check
        run: echo "exists=$([ -d task-8 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-8
        run: pip install -r ../requirements.txt
      - name: Jailbreak guard and ReAct agent tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: no live Ollama call, no Terraform/Floci/checkov,
        # those are exercised live and documented in task-8/README.md.
        working-directory: task-8
        run: python -m pytest tests -v

  readme-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_mermaid.py
