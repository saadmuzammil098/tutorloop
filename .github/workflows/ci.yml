name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-task-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Task branches are based off main and never merged (hard PR-workflow
      # rule), so a later task's branch won't contain earlier unmerged
      # tasks' folders yet. Check for the folder and skip the remaining
      # steps cleanly instead of failing CI for a task this branch doesn't
      # touch (a job-level `if` can't do this: it evaluates before
      # actions/checkout runs, so the folder never exists yet at that point).
      - name: Check task-1 exists on this branch
        id: check
        run: echo "exists=$([ -d task-1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-1
        run: pip install -r ../requirements.txt
      - name: ReAct loop, tools, and error-recovery tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: Ollama calls are monkeypatched, no live model
        # server needed. Exercises the tool router, step-limit, and
        # tool-error recovery logic directly.
        working-directory: task-1
        run: python -m pytest tests -v

  test-task-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-2 exists on this branch
        id: check
        run: echo "exists=$([ -d task-2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-2
        run: pip install -r ../requirements.txt
      - name: LangGraph routing, checkpointer, and human-in-the-loop tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn is scripted, MemorySaver is used instead
        # of the SQLite checkpointer, no live Ollama server needed.
        working-directory: task-2
        run: python -m pytest tests -v

  test-task-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-3 exists on this branch
        id: check
        run: echo "exists=$([ -d task-3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-3
        run: pip install -r ../requirements.txt
      - name: Planner/content/quiz/coordinator multi-agent tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: chat_fn is scripted per agent, no live Ollama
        # server needed.
        working-directory: task-3
        run: python -m pytest tests -v

  test-task-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check task-8 exists on this branch
        id: check
        run: echo "exists=$([ -d task-8 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: task-8
        run: pip install -r ../requirements.txt
      - name: Jailbreak guard and ReAct agent tests
        if: steps.check.outputs.exists == 'true'
        # Fast, offline: no live Ollama call, no Terraform/Floci/checkov,
        # those are exercised live and documented in task-8/README.md.
        working-directory: task-8
        run: python -m pytest tests -v

  readme-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_mermaid.py
