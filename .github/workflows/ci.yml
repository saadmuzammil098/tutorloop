name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-task-1:
    runs-on: ubuntu-latest
    # Each task lives on its own PR branch off main and is never merged
    # until the user merges it (hard PR-workflow rule), so a later task's
    # branch, based on main, won't contain earlier tasks' folders yet.
    # Skip cleanly instead of failing CI for a task this branch doesn't
    # touch.
    if: hashFiles('task-1/**') != ''
    defaults:
      run:
        working-directory: task-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: ReAct loop, tools, and error-recovery tests
        # Fast, offline: Ollama calls are monkeypatched, no live model
        # server needed. Exercises the tool router, step-limit, and
        # tool-error recovery logic directly.
        run: python -m pytest tests -v

  test-task-2:
    runs-on: ubuntu-latest
    if: hashFiles('task-2/**') != ''
    defaults:
      run:
        working-directory: task-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: LangGraph routing, checkpointer, and human-in-the-loop tests
        # Fast, offline: chat_fn is scripted, MemorySaver is used instead
        # of the SQLite checkpointer, no live Ollama server needed.
        run: python -m pytest tests -v

  readme-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_mermaid.py
